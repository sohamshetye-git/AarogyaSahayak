version: '3.8'

services:
  # PostgreSQL Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: aarogya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aarogya_db
      POSTGRES_USER: aarogya
      POSTGRES_PASSWORD: aarogya_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarogya -d aarogya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aarogya-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://aarogya:aarogya_secure_pass@postgres:5432/aarogya_db
      - INTEGRATION_MODE=mock
      - JWT_SECRET=aarogya_super_secret_jwt_key_development_only_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Healthcare Web Portal (React + Vite)
  healthcare-portal:
    build:
      context: ./apps/healthcare-portal
      dockerfile: Dockerfile
    container_name: aarogya-healthcare-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Neo4j Graph Database (Schemes and Facilities)
  neo4j:
    image: neo4j:5.18-community
    container_name: aarogya-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/aarogya_password
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  # n8n Automation Engine
  n8n:
    image: n8nio/n8n:latest
    container_name: aarogya-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  neo4j_data:
  n8n_data:
